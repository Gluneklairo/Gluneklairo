[general]
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me
udp_drop_list = 1900, 80, STUN, QUIC
fallback_udp_policy = reject
excluded_routes = 239.255.255.250/32
icmp_auto_reply = true

[dns]
server = 119.29.29.29
server = 180.184.1.1
server = 223.5.5.5
server = /dl.google.com/119.29.29.29
server = /dl.l.google.com/119.29.29.29
server = /update.googleapis.com/119.29.29.29

[policy]

[server_remote]

[filter_remote]
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Advertising/Advertising.list, tag=Advertising, force-policy=reject, update-interval=172800, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/China/China.list, tag=China, force-policy=direct, update-interval=172800, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Global/Global.list, tag=Global, force-policy=proxy, update-interval=172800, enabled=true

[rewrite_remote]
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/QuantumultX/Advertising/Advertising.conf, tag=Advertising, update-interval=172800, enabled=true
https://raw.githubusercontent.com/Amlabort/MY_clash/main/files/QX/spot-new.conf, tag=Spotify, update-interval=172800, enabled=true

[server_local]

[filter_local]
host-suffix, local, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 100.64.0.0/10, direct
ip-cidr, 224.0.0.0/4, direct
ip6-cidr, fe80::/10, direct
geoip, cn, direct
final, proxy
#Spotify
host, aet.spotify.com, reject

[rewrite_local]
^https?:\/\/(www.)?(g|google)\.cn url 302 https://www.google.com

[task_local]

[http_backend]

[mitm]
skip_validating_cert = true
hostname = www.google.cn
